name: Update GitHub Stats Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GIT_STATICS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stats via GitHub GraphQL API
        run: |
          mkdir -p _data

          gh api graphql --field login='BrunnoG92' -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection(from: "2010-01-01T00:00:00Z", to: "2026-12-31T23:59:59Z") {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalIssueContributions
                  totalPullRequestReviewContributions
                }
                repositories(first: 100, ownerAffiliations: OWNER) {
                  totalCount
                  nodes {
                    name
                    stargazerCount
                    forkCount
                    isPrivate
                    isFork
                    primaryLanguage { name }
                    languages(first: 10) { totalSize }
                  }
                }
                followers { totalCount }
                following { totalCount }
                pullRequests(first: 1) { totalCount }
                issues(first: 1) { totalCount }
              }
            }
          ' > _data/raw-stats.json

          node -e "
            const raw = require('./_data/raw-stats.json');
            const u = raw.data.user;
            const fs = require('fs');

            const langColors = {
              'C#': '239120', 'TypeScript': '3178C6', 'JavaScript': 'F7DF1E',
              'Python': '3776AB', 'HTML': 'E34F26', 'CSS': '1572B6',
              'Shell': '89E051', 'Dockerfile': '384D54', 'Kotlin': 'A97BFF',
              'Java': 'B07219', 'Go': '00ADD8', 'Rust': 'DEA584',
              'PHP': '4F5D95', 'Ruby': '701516', 'Swift': 'F05138',
              'Dart': '00B4AB', 'SCSS': 'C6538C', 'Less': '1D365D',
              'Vue': '4FC08D', 'Svelte': 'FF3E00',
            };

            let stars = 0, forks = 0, publicRepos = 0, privateRepos = 0;
            let langCount = {}, langBytes = {};

            (u.repositories.nodes || []).forEach(r => {
              if (!r.isFork) {
                stars += r.stargazerCount;
                forks += r.forkCount;
              }
              if (r.isPrivate) privateRepos++;
              else publicRepos++;

              if (r.languages && r.languages.totalSize > 0) {
                // Usar totalSize como peso da linguagem principal
                if (r.primaryLanguage) {
                  const lang = r.primaryLanguage.name;
                  langBytes[lang] = (langBytes[lang] || 0) + r.languages.totalSize;
                }
              }
            });

            // Top linguagens por bytes
            const topLangs = Object.entries(langBytes)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 5)
              .map(([name, bytes]) => ({
                name,
                bytes,
                color: langColors[name] || '6e7681'
              }));

            const totalBytes = topLangs.reduce((s, l) => s + l.bytes, 0);
            const langWithPct = topLangs.map(l => ({
              ...l,
              pct: totalBytes > 0 ? Math.round((l.bytes / totalBytes) * 100) : 0
            }));

            const data = {
              updatedAt: new Date().toISOString(),
              totalCommits: u.contributionsCollection.totalCommitContributions,
              totalPRs: u.contributionsCollection.totalPullRequestContributions,
              totalIssues: u.contributionsCollection.totalIssueContributions,
              totalReviews: u.contributionsCollection.totalPullRequestReviewContributions,
              totalRepos: u.repositories.totalCount,
              publicRepos,
              privateRepos,
              totalStars: stars,
              totalForks: forks,
              totalFollowers: u.followers.totalCount,
              totalFollowing: u.following.totalCount,
              totalPullRequests: u.pullRequests.totalCount,
              totalIssuesCreated: u.issues.totalCount,
              topLanguages: langWithPct
            };

            fs.writeFileSync('./_data/stats.json', JSON.stringify(data, null, 2) + '\n');
            fs.unlinkSync('./_data/raw-stats.json');
            console.log('Stats generated:', JSON.stringify(data, null, 2));
          "

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats data [skip ci]"
            git push
          fi
